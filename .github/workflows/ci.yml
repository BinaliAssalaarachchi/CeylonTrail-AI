name: Shared foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend restore, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Clean generated .NET output
        run: |
          find backend tests -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +

      - name: Restore API
        run: dotnet restore backend/CeylonTrail.Api/CeylonTrail.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/CeylonTrail.Api.Tests/CeylonTrail.Api.Tests.csproj

      - name: Build backend and tests
        run: dotnet build tests/CeylonTrail.Api.Tests/CeylonTrail.Api.Tests.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test tests/CeylonTrail.Api.Tests/CeylonTrail.Api.Tests.csproj --configuration Release --no-build --no-restore

  agentic-ai:
    name: Agent contract and deterministic tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check -r agentic-ai/requirements.txt

      - name: Run agent tests without external provider credentials
        run: python -m unittest discover -s agentic-ai -p "test_*.py"
